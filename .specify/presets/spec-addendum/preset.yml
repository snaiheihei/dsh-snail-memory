schema_version: "1.0"

preset:
  id: "spec-addendum"
  name: "Team Spec Addendum"
  version: "0.20.4"
  description: "Team addenda for spec-kit: confirmed assumptions, behavior-task TDD, lightweight Changes, existing-project baselines, and on-demand reference indexes."
  author: "snail"
  repository: "local"
  license: "MIT"

requires:
  speckit_version: ">=1.0.0"

provides:
  templates:
    - type: "template"
      name: "spec-template"
      file: "spec-block.md"
      description: "Out of Scope 段（wrap 住 spec-template）"
      strategy: "wrap"

    - type: "template"
      name: "constitution-template"
      file: "constitution-block.md"
      description: "质量门按成本分层（wrap 住 constitution-template）"
      strategy: "wrap"

    - type: "command"
      name: "speckit.constitution"
      file: "constitution-command-wrapper.md"
      description: "保留项目条款并迁移质量门（wrap 住 speckit.constitution）"
      strategy: "wrap"
      replaces: "speckit.constitution"

    - type: "command"
      name: "speckit.specify"
      file: "specify-command-wrapper.md"
      description: "写前假设确认与术语纪律（wrap 住 speckit.specify）"
      strategy: "wrap"
      replaces: "speckit.specify"

    - type: "command"
      name: "speckit.plan"
      file: "plan-command-wrapper.md"
      description: "门禁检查与模块审查三问（wrap 住 speckit.plan）"
      strategy: "wrap"
      replaces: "speckit.plan"

    - type: "command"
      name: "speckit.tasks"
      file: "tasks-command-wrapper.md"
      description: "测试与实现合并为逐任务行为闭环（wrap 住 speckit.tasks）"
      strategy: "wrap"
      replaces: "speckit.tasks"

    - type: "command"
      name: "speckit.implement"
      file: "implement-command-wrapper.md"
      description: "红-绿-重构循环与 expand-contract（wrap 住 speckit.implement）"
      strategy: "wrap"
      replaces: "speckit.implement"

    - type: "command"
      name: "speckit.converge"
      file: "converge-command-wrapper.md"
      description: "仅在 Change 归档时豁免用户确认的延期范围（wrap 住 speckit.converge）"
      strategy: "wrap"
      replaces: "speckit.converge"

    - type: "command"
      name: "speckit.change"
      file: "change-command.md"
      description: "Change-lite 分支入口：start/status/archive 复用 core 工作流"
      strategy: "replace"

    - type: "command"
      name: "speckit.references"
      file: "references-command.md"
      description: "搜集本地、GitHub、网页和技能参考，生成当前 feature 的按需索引"
      strategy: "replace"

    - type: "command"
      name: "speckit.baseline"
      file: "baseline-command.md"
      description: "存量项目探测：生成证据链接的单文件 baseline 与按需阅读索引"
      strategy: "replace"

tags:
  - "assumptions"
  - "scope"
  - "gate"
  - "tech-selection"
  - "plan"
  - "tasks"
  - "tdd"
  - "implement"
  - "constitution"
  - "migration"
  - "change"
  - "delta"
  - "archive"
  - "baseline"
  - "brownfield"
  - "discovery"
  - "references"
